<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Nisrin ♥ A Magical Love</title>
    <link href="https://fonts.googleapis.com/css2?family=Satisfy&family=Quicksand:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #1a0a2e;
            font-family: 'Quicksand', sans-serif;
            cursor: none;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
        }

        #bg-canvas { z-index: 0; }
        #main-canvas { z-index: 1; }
        #particle-canvas { z-index: 2; pointer-events: none; }

        .message {
            position: absolute;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 3;
            opacity: 0;
            animation: fadeInUp 2.5s ease 3.5s forwards;
            pointer-events: none;
        }

        .message h1 {
            font-family: 'Satisfy', cursive;
            font-size: clamp(2rem, 5vw, 4rem);
            color: #fff;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.8),
                         0 0 40px rgba(255, 215, 0, 0.4),
                         0 2px 4px rgba(0,0,0,0.5);
            letter-spacing: 2px;
        }

        .message p {
            margin-top: 12px;
            font-size: clamp(0.8rem, 1.5vw, 1.1rem);
            color: rgba(255, 215, 0, 0.7);
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 300;
        }

        .cursor-magic {
            position: fixed;
            width: 24px;
            height: 24px;
            pointer-events: none;
            z-index: 999;
            transform: translate(-50%, -50%);
        }

        .cursor-magic::before {
            content: '✦';
            font-size: 20px;
            color: #ffd700;
            text-shadow: 0 0 10px #ffd700, 0 0 20px #ffd700;
            animation: sparkle 1s ease-in-out infinite;
        }

        .hint {
            position: absolute;
            bottom: 3%;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.75rem;
            letter-spacing: 2px;
            z-index: 3;
            opacity: 0;
            animation: fadeInUp 2s ease 5.5s forwards;
            pointer-events: none;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        @keyframes sparkle {
            0%, 100% { transform: scale(1) rotate(0deg); opacity: 1; }
            50% { transform: scale(1.3) rotate(180deg); opacity: 0.7; }
        }
    </style>
</head>
<body>
    <canvas id="bg-canvas"></canvas>
    <canvas id="main-canvas"></canvas>
    <canvas id="particle-canvas"></canvas>

    <div class="message">
        <h1>To my wife Nisrin — Han</h1>
        <p>✦ where dreams come true ✦</p>
    </div>

    <div class="hint">move & click for Disney magic ✨</div>

    <div class="cursor-magic" id="cursor-magic"></div>

    <script>
        const bgCanvas = document.getElementById('bg-canvas');
        const mainCanvas = document.getElementById('main-canvas');
        const particleCanvas = document.getElementById('particle-canvas');
        const bgCtx = bgCanvas.getContext('2d');
        const mainCtx = mainCanvas.getContext('2d');
        const pCtx = particleCanvas.getContext('2d');
        const cursorEl = document.getElementById('cursor-magic');

        let W, H;
        let mouseX = -200, mouseY = -200;
        let time = 0;
        let drawProgress = 0;
        let heartMickeys = [];
        let particles = [];
        let magicDust = [];
        let floatingMickeys = [];
        let stars = [];
        let castleDrawn = false;

        function resize() {
            W = window.innerWidth;
            H = window.innerHeight;
            bgCanvas.width = mainCanvas.width = particleCanvas.width = W;
            bgCanvas.height = mainCanvas.height = particleCanvas.height = H;
            generateHeartMickeys();
            generateStars();
            castleDrawn = false;
        }

        function generateStars() {
            stars = [];
            for (let i = 0; i < 150; i++) {
                stars.push({
                    x: Math.random() * W,
                    y: Math.random() * H * 0.7,
                    size: Math.random() * 2,
                    twinkle: Math.random() * Math.PI * 2,
                    speed: 0.02 + Math.random() * 0.04
                });
            }
        }

        function generateHeartMickeys() {
            heartMickeys = [];
            const scale = Math.min(W, H) * 0.22;
            const cx = W / 2;
            const cy = H * 0.38;

            for (let t = 0; t < Math.PI * 2; t += 0.08) {
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
                heartMickeys.push({
                    x: cx + x * (scale / 16),
                    y: cy + y * (scale / 16),
                    size: 6 + Math.random() * 4,
                    delay: t / (Math.PI * 2)
                });
            }

            // Fill inside with scattered mickeys
            for (let i = 0; i < 60; i++) {
                const angle = Math.random() * Math.PI * 2;
                const r = Math.random() * 0.75;
                const t = angle;
                const hx = 16 * Math.pow(Math.sin(t), 3);
                const hy = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
                heartMickeys.push({
                    x: cx + hx * r * (scale / 16),
                    y: cy + hy * r * (scale / 16),
                    size: 4 + Math.random() * 5,
                    delay: 0.5 + Math.random() * 0.5
                });
            }
        }

        window.addEventListener('resize', resize);
        resize();

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            cursorEl.style.left = mouseX + 'px';
            cursorEl.style.top = mouseY + 'px';

            if (Math.random() > 0.4) {
                magicDust.push(createDust(mouseX, mouseY));
            }
        });

        document.addEventListener('click', (e) => {
            for (let i = 0; i < 25; i++) {
                particles.push(createMagicBurst(e.clientX, e.clientY));
            }
            // Spawn mini mickey on click
            for (let i = 0; i < 5; i++) {
                particles.push(createMickeyParticle(e.clientX, e.clientY));
            }
        });

        document.addEventListener('touchstart', (e) => {
            const t = e.touches[0];
            mouseX = t.clientX; mouseY = t.clientY;
            for (let i = 0; i < 25; i++) {
                particles.push(createMagicBurst(mouseX, mouseY));
            }
        });

        document.addEventListener('touchmove', (e) => {
            const t = e.touches[0];
            mouseX = t.clientX; mouseY = t.clientY;
            if (Math.random() > 0.3) magicDust.push(createDust(mouseX, mouseY));
        });

        function createDust(x, y) {
            return {
                x, y,
                vx: (Math.random() - 0.5) * 2,
                vy: -1 - Math.random() * 2,
                life: 1,
                decay: 0.02 + Math.random() * 0.02,
                size: 2 + Math.random() * 3,
                type: 'star'
            };
        }

        function createMagicBurst(x, y) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 2 + Math.random() * 5;
            return {
                x, y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                life: 1,
                decay: 0.015 + Math.random() * 0.015,
                size: 3 + Math.random() * 4,
                type: 'sparkle',
                rotation: Math.random() * Math.PI * 2
            };
        }

        function createMickeyParticle(x, y) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 1 + Math.random() * 3;
            return {
                x, y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed - 2,
                life: 1,
                decay: 0.008 + Math.random() * 0.01,
                size: 8 + Math.random() * 8,
                type: 'mickey'
            };
        }

        function drawMickey(ctx, x, y, size, color) {
            ctx.fillStyle = color;
            // Head
            ctx.beginPath();
            ctx.arc(x, y, size, 0, Math.PI * 2);
            ctx.fill();
            // Left ear
            ctx.beginPath();
            ctx.arc(x - size * 0.8, y - size * 0.8, size * 0.6, 0, Math.PI * 2);
            ctx.fill();
            // Right ear
            ctx.beginPath();
            ctx.arc(x + size * 0.8, y - size * 0.8, size * 0.6, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawStar4(ctx, x, y, size) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(time * 0.05);
            ctx.beginPath();
            for (let i = 0; i < 4; i++) {
                const angle = (i * Math.PI / 2);
                ctx.moveTo(0, 0);
                ctx.lineTo(Math.cos(angle) * size, Math.sin(angle) * size);
                ctx.lineTo(Math.cos(angle + Math.PI/4) * size * 0.4, Math.sin(angle + Math.PI/4) * size * 0.4);
            }
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }

        function drawCastle(ctx) {
            const castleW = W * 0.25;
            const castleH = H * 0.18;
            const cx = W / 2;
            const baseY = H * 0.92;

            ctx.save();
            ctx.globalAlpha = 0.08;

            // Main body
            ctx.fillStyle = '#c0a0ff';
            ctx.fillRect(cx - castleW * 0.3, baseY - castleH * 0.5, castleW * 0.6, castleH * 0.5);

            // Central tower
            ctx.fillRect(cx - castleW * 0.08, baseY - castleH, castleW * 0.16, castleH);

            // Tower top (triangle)
            ctx.beginPath();
            ctx.moveTo(cx, baseY - castleH - castleH * 0.3);
            ctx.lineTo(cx - castleW * 0.12, baseY - castleH);
            ctx.lineTo(cx + castleW * 0.12, baseY - castleH);
            ctx.fill();

            // Side towers
            [-1, 1].forEach(dir => {
                const tx = cx + dir * castleW * 0.35;
                ctx.fillRect(tx - castleW * 0.06, baseY - castleH * 0.7, castleW * 0.12, castleH * 0.7);
                ctx.beginPath();
                ctx.moveTo(tx, baseY - castleH * 0.7 - castleH * 0.2);
                ctx.lineTo(tx - castleW * 0.08, baseY - castleH * 0.7);
                ctx.lineTo(tx + castleW * 0.08, baseY - castleH * 0.7);
                ctx.fill();
            });

            // Smaller side towers
            [-1, 1].forEach(dir => {
                const tx = cx + dir * castleW * 0.2;
                ctx.fillRect(tx - castleW * 0.04, baseY - castleH * 0.6, castleW * 0.08, castleH * 0.6);
                ctx.beginPath();
                ctx.moveTo(tx, baseY - castleH * 0.6 - castleH * 0.15);
                ctx.lineTo(tx - castleW * 0.06, baseY - castleH * 0.6);
                ctx.lineTo(tx + castleW * 0.06, baseY - castleH * 0.6);
                ctx.fill();
            });

            ctx.restore();
        }

        function drawBackground() {
            if (!castleDrawn) {
                // Deep Disney night sky gradient
                const grad = bgCtx.createLinearGradient(0, 0, 0, H);
                grad.addColorStop(0, '#0a0020');
                grad.addColorStop(0.4, '#1a0a3e');
                grad.addColorStop(0.7, '#2d1b69');
                grad.addColorStop(1, '#1a0a2e');
                bgCtx.fillStyle = grad;
                bgCtx.fillRect(0, 0, W, H);

                drawCastle(bgCtx);
                castleDrawn = true;
            }

            // Twinkling stars
            stars.forEach(star => {
                star.twinkle += star.speed;
                const alpha = 0.3 + Math.sin(star.twinkle) * 0.4;
                bgCtx.save();
                bgCtx.globalAlpha = Math.max(0, alpha);
                bgCtx.fillStyle = '#ffd700';
                drawStar4(bgCtx, star.x, star.y, star.size);
                bgCtx.restore();
            });
        }

        function drawHeartOfMickeys() {
            mainCtx.clearRect(0, 0, W, H);

            if (drawProgress < 1) {
                drawProgress += 0.005;
            }

            const pulse = 1 + Math.sin(time * 0.03) * 0.015;
            const cx = W / 2;
            const cy = H * 0.38;

            mainCtx.save();
            mainCtx.translate(cx, cy);
            mainCtx.scale(pulse, pulse);
            mainCtx.translate(-cx, -cy);

            heartMickeys.forEach((m, i) => {
                const progress = Math.min(drawProgress, 1);
                if (m.delay > progress) return;

                const localProgress = Math.min((progress - m.delay) / 0.2, 1);
                const size = m.size * localProgress;

                // Glow
                mainCtx.save();
                mainCtx.shadowColor = '#ff2040';
                mainCtx.shadowBlur = 10;

                const isOutline = i < heartMickeys.length - 60;
                const color = isOutline
                    ? `rgba(30, 30, 30, ${localProgress})`
                    : `rgba(220, 20, 60, ${localProgress * 0.8})`;

                drawMickey(mainCtx, m.x, m.y, size, color);
                mainCtx.restore();

                // Disney sparkle on newly appearing
                if (localProgress > 0.8 && localProgress < 1 && Math.random() > 0.8) {
                    magicDust.push({
                        x: m.x + (Math.random() - 0.5) * 10,
                        y: m.y + (Math.random() - 0.5) * 10,
                        vx: (Math.random() - 0.5) * 1,
                        vy: -0.5 - Math.random(),
                        life: 1,
                        decay: 0.03,
                        size: 3,
                        type: 'star'
                    });
                }
            });

            // Red bow at center bottom of heart
            if (drawProgress > 0.8) {
                const bowAlpha = Math.min((drawProgress - 0.8) / 0.2, 1);
                mainCtx.save();
                mainCtx.globalAlpha = bowAlpha;
                const bowX = cx;
                const bowY = cy + Math.min(W, H) * 0.22 * 0.85;
                const bowSize = 12;

                mainCtx.fillStyle = '#ff1744';
                // Left loop
                mainCtx.beginPath();
                mainCtx.ellipse(bowX - bowSize, bowY, bowSize, bowSize * 0.6, -0.3, 0, Math.PI * 2);
                mainCtx.fill();
                // Right loop
                mainCtx.beginPath();
                mainCtx.ellipse(bowX + bowSize, bowY, bowSize, bowSize * 0.6, 0.3, 0, Math.PI * 2);
                mainCtx.fill();
                // Center knot
                mainCtx.beginPath();
                mainCtx.arc(bowX, bowY, bowSize * 0.4, 0, Math.PI * 2);
                mainCtx.fillStyle = '#cc0033';
                mainCtx.fill();

                // Mickey polka dots on bow
                mainCtx.fillStyle = '#fff';
                [[-bowSize * 0.8, -2], [bowSize * 0.8, -2], [-bowSize * 1.2, 2], [bowSize * 1.2, 2]].forEach(([dx, dy]) => {
                    mainCtx.beginPath();
                    mainCtx.arc(bowX + dx, bowY + dy, 2, 0, Math.PI * 2);
                    mainCtx.fill();
                });

                mainCtx.restore();
            }

            mainCtx.restore();
        }

        function updateParticles() {
            pCtx.clearRect(0, 0, W, H);

            // Magic dust (cursor trail)
            magicDust = magicDust.filter(p => p.life > 0);
            magicDust.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= p.decay;

                if (p.life > 0) {
                    pCtx.save();
                    pCtx.globalAlpha = p.life;
                    pCtx.fillStyle = `rgba(255, 215, 0, ${p.life})`;
                    pCtx.shadowColor = '#ffd700';
                    pCtx.shadowBlur = 8;
                    drawStar4(pCtx, p.x, p.y, p.size * p.life);
                    pCtx.restore();
                }
            });

            // Click particles
            particles = particles.filter(p => p.life > 0);
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.05;
                p.vx *= 0.98;
                p.life -= p.decay;

                if (p.life <= 0) return;

                pCtx.save();
                pCtx.globalAlpha = p.life;

                if (p.type === 'mickey') {
                    drawMickey(pCtx, p.x, p.y, p.size * p.life,
                        `rgba(30, 30, 30, ${p.life})`);
                    pCtx.shadowColor = '#ff4081';
                    pCtx.shadowBlur = 5;
                } else {
                    pCtx.fillStyle = `rgba(255, 215, 0, ${p.life})`;
                    pCtx.shadowColor = '#ffd700';
                    pCtx.shadowBlur = 10;
                    drawStar4(pCtx, p.x, p.y, p.size * p.life);
                }

                pCtx.restore();
            });

            // Floating mickeys
            if (time % 60 === 0 && floatingMickeys.length < 10) {
                floatingMickeys.push({
                    x: Math.random() * W,
                    y: H + 30,
                    size: 6 + Math.random() * 10,
                    speed: 0.3 + Math.random() * 0.8,
                    wobble: Math.random() * Math.PI * 2,
                    wobbleSpeed: 0.015 + Math.random() * 0.02,
                    opacity: 0.15 + Math.random() * 0.2
                });
            }

            floatingMickeys = floatingMickeys.filter(m => m.y > -40);
            floatingMickeys.forEach(m => {
                m.y -= m.speed;
                m.wobble += m.wobbleSpeed;
                m.x += Math.sin(m.wobble) * 0.5;

                pCtx.save();
                pCtx.globalAlpha = m.opacity;
                drawMickey(pCtx, m.x, m.y, m.size, 'rgba(255, 255, 255, 0.3)');
                pCtx.restore();
            });
        }

        // Shooting star effect
        let shootingStars = [];
        function maybeShootingStar() {
            if (Math.random() > 0.995 && shootingStars.length < 2) {
                shootingStars.push({
                    x: Math.random() * W * 0.8,
                    y: Math.random() * H * 0.3,
                    vx: 3 + Math.random() * 4,
                    vy: 1 + Math.random() * 2,
                    life: 1,
                    trail: []
                });
            }
        }

        function updateShootingStars() {
            shootingStars = shootingStars.filter(s => s.life > 0);
            shootingStars.forEach(s => {
                s.x += s.vx;
                s.y += s.vy;
                s.life -= 0.015;
                s.trail.push({ x: s.x, y: s.y, alpha: s.life });
                if (s.trail.length > 20) s.trail.shift();

                pCtx.save();
                s.trail.forEach((t, i) => {
                    pCtx.globalAlpha = t.alpha * (i / s.trail.length) * 0.5;
                    pCtx.fillStyle = '#ffd700';
                    pCtx.beginPath();
                    pCtx.arc(t.x, t.y, 2 * (i / s.trail.length), 0, Math.PI * 2);
                    pCtx.fill();
                });
                pCtx.globalAlpha = s.life;
                pCtx.fillStyle = '#fff';
                pCtx.shadowColor = '#ffd700';
                pCtx.shadowBlur = 15;
                pCtx.beginPath();
                pCtx.arc(s.x, s.y, 3, 0, Math.PI * 2);
                pCtx.fill();
                pCtx.restore();
            });
        }

        function animate() {
            time++;
            drawBackground();
            drawHeartOfMickeys();
            updateParticles();
            maybeShootingStar();
            updateShootingStars();
            requestAnimationFrame(animate);
        }

        // Initial fill
        bgCtx.fillStyle = '#0a0020';
        bgCtx.fillRect(0, 0, W, H);

        animate();
    </script>
</body>
</html>
